# Shared by every proxy_pass, because four copies of this drift.
#
# Nothing proxies this box, so $remote_addr IS the client. That stops being true the moment
# anything is put in front (a CDN, a load balancer), at which point every request arrives from one
# address and the real client moves into X-Forwarded-For, which would then have to be explicitly
# trusted before anything believed it.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# The backend streams uploads and the parse used to take seconds. 60s is the default read timeout
# and is left alone deliberately: a longer one hides a hung upstream rather than failing it.
proxy_http_version 1.1;
proxy_set_header Connection "";
