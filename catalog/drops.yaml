  # portraits are cut rather than downloaded.
  #
  # That capture is not native scale, so the art is a little soft. It is a DISPLAY icon and nothing
  # matches against it, which is the only reason that is acceptable. Replace it with a native cut,
  # or with the mirror's own sprite once a dataset carries it.
  #
  # The cut keeps the star's BODY and drops its glow, which is the only version with no grey in it.
  # The glow is semi-transparent and the capture flattened it over the grey slot, so those pixels are
  # part grey and no threshold takes that back: keying by brightness left the slot's light top half
  # behind, and keying harder ate the star. Warm gold, the dark outline and the white core, largest
  # connected run, trimmed to the bbox. At the size this is drawn the glow was never visible.
  - key: vestige-of-erion
    name: Vestige of Erion Coupon
    art: cut

  # --- Eternal pieces ----------------------------------------------------------------
