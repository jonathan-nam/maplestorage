# The boss drop tables. Source of truth for what a boss can drop, and the art shown beside it.
#
# `catalog/build.py` generates the backend seed (R__drop_catalog.sql) and downloads the official
# icons into backend/src/main/resources/seed-assets/drops/. Same rules as items.yaml:
#
#     python catalog/build.py                 regenerate
#     python catalog/build.py --check         fail if the generated seed is stale
#     python catalog/build.py --fetch-icons   re-download the official art
#
# `key` is the identifier. It names the icon asset (seed-assets/drops/<key>.png) and the
# drop_catalog.drop_key column, so renaming one renames the other two.
#
# `name` is the in-game display name as maplestory.io has it, which is not always how a player
# says it: the game calls it "Exceptional Hammer (Face Acc)", not "(Face Accessory)".
#
# `icon_id` is the Nexon item id the art comes from. Absent means the pinned dataset (GMS v268,
# see ICON_VERSION) does not have the item yet, and the drop is drawn without art rather than with
# somebody else's.
#
# `per_member` marks a drop each member receives their own copy of: ALWAYS, or HEROIC when it is
# one drop for the party in Interactive worlds and one each in Heroic/Reboot. It is the one flag
# here that changes a NUMBER: a per-member drop is not pooled, so splitting one six ways would pay
# everybody a sixth of something they each already have. The loot pool says so on the row.
#
# `worlds` narrows a drop to where it exists at all: INTERACTIVE, for the coupons that do not drop
# in Reboot. Absent means everywhere.
#
# Flags sit on the item rather than on the (boss, item) pair because nothing in these tables
# behaves differently per boss. Move one down to `tables` the day that stops being true.
#
# That day arrived for `pieces`. How many vestige coupons a boss drops is per (boss, difficulty),
# not per item, so a table entry may be a mapping instead of a bare key:
#
#     - key: vestige-of-erion
#       pieces:
#         EXTREME: 180
#
# It fills the count when a drop is logged, so the number is one somebody can correct rather than
# one they have to remember. Only the difficulties listed drop any; a difficulty left out fills
# nothing, which is not the same as filling zero.

drops:
  # --- Brilliant Boss Set, one accessory per boss -------------------------------------
  # Four pieces, in release order. Each drops from one boss and nowhere else, so a boss has at
  # most one of them.
  - key: whisper-of-the-source
    name: Whisper of the Source
    icon_id: 1113341
  - key: oath-of-death
    name: Oath of Death
    icon_id: 1122447
  - key: immortal-legacy
    name: Immortal Legacy
    icon_id: 1143471
  # No icon_id, for the reason given on eternal-armor-of-radiance-box: GMS v268 predates
  # Malefic Star.
  - key: blissful-nightmare
    name: Blissful Nightmare

  # --- Exceptional Hammers, one slot per boss ----------------------------------------
  - key: exceptional-hammer-face
    name: Exceptional Hammer (Face Acc)
    icon_id: 2644205
  - key: exceptional-hammer-eye
    name: Exceptional Hammer (Eye Acc)
    icon_id: 2644206
  - key: exceptional-hammer-earrings
    name: Exceptional Hammer (Earrings)
    icon_id: 2644207
  - key: exceptional-hammer-medal
    name: Exceptional Hammer (Medal)
    icon_id: 2644208

  # --- Grindstones -------------------------------------------------------------------
  # Two item ids carry each grindstone name (2539003/2539004 and 2539001/2539002), the tradeable
  # and untradeable versions. The lower one is pinned; the art is the same either way.
  - key: grindstone-of-faith
    name: Grindstone of Faith
    icon_id: 2539003
  - key: grindstone-of-life
    name: Grindstone of Life
    icon_id: 2539001

  # --- Scroll coupons, Interactive worlds only ---------------------------------------
  - key: premium-scroll-accessory-coupon
    name: Premium Scroll - Accessory Coupon
    icon_id: 2633916
    worlds: INTERACTIVE
  - key: premium-scroll-pet-equipment-coupon
    name: Premium Scroll - Pet Equipment Coupon
    icon_id: 2633917
    worlds: INTERACTIVE
  - key: magical-scroll-weapon-coupon
    name: Magical Scroll - Weapon Coupon
    icon_id: 2633918
    worlds: INTERACTIVE

  # --- Eternal armour boxes ----------------------------------------------------------
  - key: eternal-armor-of-desire-box
    name: Eternal Armor of Desire Box
    icon_id: 2638066
  - key: divine-eternal-armor-box
    name: Divine Eternal Armor Box
    icon_id: 2638064
  - key: ferocious-beast-eternal-armor-box
    name: Ferocious Beast Eternal Armor Box
    icon_id: 2638065
  - key: ancient-eternal-armor-box
    name: Ancient Eternal Armor Box
    icon_id: 2830306
  - key: eternal-armor-of-oaths-box
    name: Eternal Armor of Oaths Box
    icon_id: 2639253
  # No icon_id: GMS v268 is the newest complete dataset the mirror has and it does not carry this
  # item. Drawn without art until the version is bumped and this is re-validated.
  - key: eternal-armor-of-radiance-box
    name: Eternal Armor of Radiance Box

  # --- Selection and ring boxes ------------------------------------------------------
  - key: mitras-rage-selection-box
    name: Mitra's Rage Selection Box
    icon_id: 2633927

  # --- The rings the boss ring boxes are opened for ----------------------------------
  # The tables list these rather than the Life / White Jade Boss Ring Box they come out of: the
  # box is a wrapper, and only these two levels of ring are worth anything, so a pool row saying
  # "ring box" would not say what was actually worth splitting.
  #
  # The ids are the base rings. A ring's LEVEL is not part of its item id, so the art is the
  # ring's, and the level lives in the name.
  - key: ring-of-restraint-4
    name: Ring of Restraint Lv. 4
    icon_id: 1113098
    per_member: HEROIC
  - key: continuous-ring-4
    name: Continuous Ring Lv. 4
    icon_id: 1113329
    per_member: HEROIC

  # --- Astra secondary material ------------------------------------------------------
  # The boss drop is the COUPON, which is the tradeable one. The vestige it redeems for is not, so
  # the coupon is the thing a party sells and splits, the same reasoning as the boss rings above.
  #
  # No `quantity`: how many drop is per (boss, difficulty), not per item. Extreme Kalos gives 180
  # and Extreme Seren 30, both in as many bundles as the boss's party cap, and one number on the
  # item could only be wrong for six of the seven. What a party actually looted is typed on the
  # pool row.
  #
  # `art: cut` rather than an icon_id: this is a v270 item and the pinned dataset is GMS v268. The
  # mirror has no v269 or v270 at all, so there is no version to point at and the sprite is supplied
  # by hand instead, the same way the boss portraits are.
  #
  # This one is the game's own 37x37 sprite, with its real per-pixel alpha. That matters: the glow is
  # semi-transparent, and the first five attempts here cut it out of a screenshot where it had been
  # flattened over a light grey slot. Those pixels are part grey by construction, so no key or
  # un-multiply recovers them, and every version was either boxed in grey or wrong in colour. If this
  # ever needs replacing, replace it with a sprite and not a capture.
  - key: vestige-of-erion
#       pieces:
#         EXTREME: 180
#
# It fills the count when a drop is logged, so the number is one somebody can correct rather than
# one they have to remember. Only the difficulties listed drop any; a difficulty left out fills
# nothing, which is not the same as filling zero.

