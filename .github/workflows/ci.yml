name: CI

# Runs on pull requests and pushes to master. Uses a paths-filter job rather
# than top-level `on.paths` filtering deliberately: top-level path filters
# would make this workflow simply not trigger on PRs that don't touch a
# given path, which breaks GitHub's required-status-check semantics (a
# required check that never runs leaves the PR stuck waiting on it forever).
# This pattern keeps the workflow always triggering, with irrelevant jobs
# cleanly skipping instead.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            infra:
              - 'infra/**'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/backend-verify.yml

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check .

  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
      # -backend=false: this job only lints/validates, it never touches
      # infra/terraform.tfstate or needs AWS credentials at all.
      - run: terraform init -backend=false
      - run: terraform fmt -check -recursive
      - run: terraform validate
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: "v0.63.1"
      - run: tflint --init
      - run: tflint --recursive
