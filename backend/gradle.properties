kotlin.code.style=official

# --- Memory, deliberately conservative -------------------------------------
#
# This all runs inside the dev container, and so does everything else: the VS
# Code server, the language servers, Docker builds, and the compose stack
# (Postgres + a JVM backend + the Python vision service). WSL2 hands the whole VM
# about half the host's RAM by default -- ~7.7GB on a 16GB machine -- and a Gradle
# build can quietly claim a third of that across FOUR separate JVMs: the Gradle
# daemon, the Kotlin compile daemon, and its workers.
#
# When that box fills, WSL thrashes, the Docker API stops answering, and Docker
# Desktop cannot stop a VM that is no longer scheduling -- which is why the
# container appears to freeze and only a reboot clears it. Capping the daemons
# costs a little build speed and removes a whole class of "my machine hung".
#
# See the dev-container notes in the root README if you want the memory back.
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=512m

# The Kotlin compile daemon is a SEPARATE JVM from Gradle's, and it is uncapped by
# default -- this was the single biggest unbounded consumer.
kotlin.daemon.jvmargs=-Xmx1g

# nproc reports 16 inside the container, so Gradle would happily start 16 workers.
org.gradle.workers.max=4
